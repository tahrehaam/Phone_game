<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="미니 게임">
<meta name="theme-color" content="#1b1f3b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>미니 게임 모음</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { touch-action: manipulation; overflow: auto; }
  body { background: radial-gradient(circle at 50% 0%, #2c3270, #1b1f3b 60%); min-height: 100%; }
  #lobby { padding: calc(var(--top) + 20px) 16px calc(var(--bottom) + 24px); max-width: 480px; margin: 0 auto; box-sizing: border-box; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #hello { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #changeName { background: rgba(255,255,255,.1); border: 0; color: #fff; font-size: 13px;
    padding: 7px 12px; border-radius: 999px; white-space: nowrap; font-family: inherit; }
  .title { font-size: 32px; font-weight: 900; color: var(--yellow); margin: 22px 0 2px; }
  .sub { opacity: .7; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
    padding: 16px 14px; border-radius: 20px; border: 0; color: #fff; font-family: inherit;
    background: rgba(255,255,255,.07); position: relative; overflow: hidden; min-height: 150px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
  .card:active { transform: scale(.97); }
  .card::before { content: ''; position: absolute; inset: auto -30px -30px auto; width: 110px; height: 110px;
    border-radius: 50%; background: var(--c); opacity: .18; }
  .card .em { font-size: 40px; line-height: 1; margin-bottom: 6px; }
  .card .nm { font-size: 18px; font-weight: 800; color: var(--c); }
  .card .ds { font-size: 13px; opacity: .75; line-height: 1.35; }
  .card .bs { font-size: 13px; font-weight: 700; margin-top: auto; padding-top: 6px; }
  #rankOpen { width: 100%; margin-top: 18px; }

  #nameBox { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; margin-top: 8px; }
  #nameInput { width: 100%; box-sizing: border-box; text-align: center; font-size: 20px; padding: 14px;
    border-radius: 12px; border: 2px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
    color: #fff; -webkit-user-select: text; user-select: text; font-family: inherit; }
  #nameInput:focus { outline: none; border-color: var(--yellow); }
  #nameMsg { min-height: 20px; font-size: 14px; color: #ff8a95; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 340px; margin-bottom: 6px; }
  .tabs button { border: 0; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-family: inherit;
    background: rgba(255,255,255,.1); color: #fff; }
  .tabs button.on { background: var(--yellow); color: #1b1f3b; font-weight: 800; }
</style>
</head>
<body>
<div id="safe"></div>

<div id="lobby" class="hidden">
  <div class="top">
    <span id="hello"></span>
    <button id="changeName">이름 바꾸기</button>
  </div>
  <div class="title">🎮 미니 게임 모음</div>
  <p class="sub">하고 싶은 게임을 골라 보세요</p>
  <div class="grid" id="grid"></div>
  <button class="btn2" id="rankOpen">🏆 전체 랭킹 보기</button>
</div>

<div id="nameMenu" class="overlay hidden">
  <h1>🎮 미니 게임</h1>
  <h2>닉네임을 정해 주세요</h2>
  <p>랭킹에 이 이름으로 기록돼요</p>
  <div id="nameBox">
    <input id="nameInput" type="text" maxlength="10" placeholder="닉네임 (최대 10글자)" autocomplete="off" enterkeyhint="done">
    <p id="nameMsg"></p>
    <button class="btn" id="nameOkBtn">확인</button>
  </div>
</div>

<div id="rankMenu" class="overlay hidden" style="justify-content:flex-start">
  <h1 style="margin-top:12px">🏆 랭킹</h1>
  <div class="tabs" id="tabs"></div>
  <ul class="rankList" id="rankList"></ul>
  <p class="rankMsg" id="rankMsg"></p>
  <button class="btn" id="rankClose">닫기</button>
</div>

<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let name = G.getName();

// 게임 카드 만들기
function buildGrid() {
  const grid = $('grid'); grid.innerHTML = '';
  for (const g of GAMES) {
    const a = document.createElement('button');
    a.className = 'card'; a.style.setProperty('--c', g.color);
    const best = G.getBest(g.id);
    a.innerHTML = `<span class="em"></span><span class="nm"></span><span class="ds"></span><span class="bs"></span>`;
    a.querySelector('.em').textContent = g.emoji;
    a.querySelector('.nm').textContent = g.title;
    a.querySelector('.ds').textContent = g.desc;
    a.querySelector('.bs').textContent = best ? `🏆 최고 ${best}` : '아직 기록 없음';
    a.onclick = () => { G.sfx.tap(); location.href = `games/${g.id}.html`; };
    grid.append(a);
  }
}

function showLobby() {
  $('hello').textContent = `👋 ${name}님, 반가워요!`;
  buildGrid();
  $('nameMenu').classList.add('hidden');
  $('rankMenu').classList.add('hidden');
  $('lobby').classList.remove('hidden');
}

function openNameMenu() {
  $('nameInput').value = name;
  $('nameMsg').textContent = '';
  $('lobby').classList.add('hidden');
  $('nameMenu').classList.remove('hidden');
}
$('nameOkBtn').onclick = () => {
  const n = $('nameInput').value.trim().slice(0, 10);
  if (!n) { $('nameMsg').textContent = '닉네임을 입력해 주세요'; $('nameInput').focus(); return; }
  name = n; G.setName(n); $('nameInput').blur(); G.sfx.tap();
  showLobby();
};
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameOkBtn').click(); });
$('changeName').onclick = openNameMenu;

// 전체 랭킹 (게임별 탭)
let rankGame = GAMES[0].id;
function renderTabs() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  for (const g of GAMES) {
    const b = document.createElement('button');
    b.textContent = `${g.emoji} ${g.title}`;
    if (g.id === rankGame) b.className = 'on';
    b.onclick = () => { rankGame = g.id; renderTabs(); loadRank(); };
    tabs.append(b);
  }
}
function loadRank() {
  const g = GAMES.find(x => x.id === rankGame);
  G.renderRanking(g.col, $('rankList'), $('rankMsg'), G.load('myDoc_' + g.id, null));
}
$('rankOpen').onclick = () => { $('rankMenu').classList.remove('hidden'); renderTabs(); loadRank(); };
$('rankClose').onclick = () => $('rankMenu').classList.add('hidden');

// 뒤로가기로 돌아왔을 때 최고 점수 새로 표시
window.addEventListener('pageshow', () => { if (name) buildGrid(); });

if (name) showLobby(); else openNameMenu();
</script>
</body>
</html>
