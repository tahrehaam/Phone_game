<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="별 잡기">
<meta name="theme-color" content="#1b1f3b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>별 잡기</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f3b; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center;
    background: rgba(27,31,59,.85); }
  #overlay h1 { font-size: 40px; margin: 0 0 8px; color: #ffd447; }
  #overlay p { margin: 4px 0; opacity: .85; }
  #overlay button { margin-top: 24px; font-size: 22px; padding: 14px 40px; border: 0;
    border-radius: 999px; background: #ffd447; color: #1b1f3b; font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>⭐ 별 잡기</h1>
  <p>손가락으로 바구니를 움직여 별을 받으세요</p>
  <p>빨간 폭탄은 피하세요!</p>
  <p id="best"></p>
  <button id="start">시작</button>
</div>
<script>
// ===== 설정 =====
const LIVES = 3;          // 목숨 수
const START_SPEED = 180;  // 처음 낙하 속도 (픽셀/초)
const SPEEDUP = 6;        // 초당 속도 증가량
const BOMB_CHANCE = 0.25; // 폭탄이 나올 확률

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const bestEl = document.getElementById('best');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let best = 0;
try { best = Number(localStorage.getItem('best') || 0); } catch (e) {}
function showBest() { bestEl.textContent = best ? `최고 점수: ${best}` : ''; }
showBest();

let state = null;

function newGame() {
  state = { score: 0, lives: LIVES, items: [], spawnTimer: 0,
    speed: START_SPEED, basketX: W / 2, running: true, last: performance.now() };
}

// 터치 / 마우스로 바구니 이동
function moveTo(x) { if (state) state.basketX = x; }
canvas.addEventListener('touchstart', e => moveTo(e.touches[0].clientX), { passive: true });
canvas.addEventListener('touchmove', e => moveTo(e.touches[0].clientX), { passive: true });
canvas.addEventListener('mousemove', e => moveTo(e.clientX));

document.getElementById('start').addEventListener('click', () => {
  overlay.classList.add('hidden');
  newGame();
  requestAnimationFrame(loop);
});

function spawn() {
  const bomb = Math.random() < BOMB_CHANCE;
  state.items.push({ x: 20 + Math.random() * (W - 40), y: -20, r: bomb ? 16 : 18,
    bomb, vy: state.speed * (0.8 + Math.random() * 0.4) });
}

function update(dt) {
  state.speed += SPEEDUP * dt;
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawn();
    state.spawnTimer = Math.max(0.25, 0.9 - state.score * 0.01);
  }
  const bw = Math.min(110, W * 0.28), by = H - 70;
  for (const it of state.items) {
    it.y += it.vy * dt;
    const caught = it.y + it.r > by && it.y - it.r < by + 20 &&
                   Math.abs(it.x - state.basketX) < bw / 2 + it.r * 0.5;
    if (caught) {
      it.dead = true;
      if (it.bomb) { state.lives--; navigator.vibrate?.(150); }
      else state.score++;
    } else if (it.y - it.r > H) {
      it.dead = true;
      if (!it.bomb) state.lives--;
    }
  }
  state.items = state.items.filter(i => !i.dead);
  if (state.lives <= 0) gameOver();
}

function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5;
    ctx.lineTo(x + rr * Math.sin(a), y - rr * Math.cos(a));
  }
  ctx.closePath(); ctx.fillStyle = '#ffd447'; ctx.fill();
}

function draw() {
  ctx.fillStyle = '#1b1f3b'; ctx.fillRect(0, 0, W, H);
  for (const it of state.items) {
    if (it.bomb) {
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ff4d5e'; ctx.fill();
    } else drawStar(it.x, it.y, it.r);
  }
  const bw = Math.min(110, W * 0.28), by = H - 70;
  ctx.fillStyle = '#5ad1ff';
  ctx.beginPath(); ctx.roundRect(state.basketX - bw / 2, by, bw, 20, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left';  ctx.fillText(`점수 ${state.score}`, 16, 50);
  ctx.textAlign = 'right'; ctx.fillText('❤️'.repeat(Math.max(0, state.lives)), W - 16, 50);
}

function loop(now) {
  if (!state.running) return;
  const dt = Math.min(0.05, (now - state.last) / 1000);
  state.last = now;
  update(dt);
  if (state.running) draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  state.running = false;
  if (state.score > best) {
    best = state.score;
    try { localStorage.setItem('best', best); } catch (e) {}
  }
  overlay.querySelector('h1').textContent = `점수 ${state.score}`;
  showBest();
  document.getElementById('start').textContent = '다시 하기';
  overlay.classList.remove('hidden');
}
</script>
</body>
</html>
